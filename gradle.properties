# Project-wide Gradle settings for Pxl Cam (pxl-cam)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
android.enableJetifier=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true
org.gradle.dependency.verification=off
android.enableR8.fullMode=false
kotlin.incremental=true

# Versioning & SDK targets (Play Store compliant: targetSdk 36 >= 35 requirement)
pxlcam.versionCode=1
pxlcam.versionName=1.0.0
android.minSdkVersion=26
android.compileSdkVersion=36
android.targetSdkVersion=36

